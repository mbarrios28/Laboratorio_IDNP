<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup - Registro completo (Incremento 3)</title>
<style>
  body { font-family: Arial, sans-serif; background:#2d2d2d; display:flex; justify-content:center; padding:40px; }
  .phone { width:320px; background:#fff; border-radius:24px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,.5); }
  h1 { font-size:24px; margin:8px 0 24px; }
  .field { margin-bottom:18px; }
  label { display:block; font-size:12px; color:#666; margin-bottom:4px; }
  input { width:100%; box-sizing:border-box; padding:12px; font-size:15px; border:1px solid #888; border-radius:6px; outline:none; }
  input:focus { border-color:#6200ee; border-width:2px; }
  .msg { font-size:11px; margin-top:4px; }
  .msg.error { color:#b3261e; }
  .row { display:flex; gap:16px; margin-top:12px; }
  button { flex:1; padding:12px; font-size:14px; border-radius:20px; cursor:pointer; }
  .outlined { background:#fff; color:#6200ee; border:1px solid #888; }
  .filled { background:#6200ee; color:#fff; border:1px solid #6200ee; }
  .filled.disabled { background:#e0e0e0; color:#999; border:1px solid #e0e0e0; cursor:not-allowed; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; justify-content:center; align-items:center; }
  .dialog { background:#fff; border-radius:16px; padding:20px; width:280px; }
  .dialog h2 { margin:0 0 8px; font-size:20px; }
  .dialog p { font-size:14px; color:#333; line-height:1.5; }
  .dialog button { width:100%; margin-top:12px; background:#6200ee; color:#fff; border:none; border-radius:20px; padding:10px; }
</style>
</head>
<body>
  <div class="phone">
    <h1>Registro</h1>
    <div class="field">
      <label>Nombre</label>
      <input type="text" value="Eduardo">
    </div>
    <div class="field">
      <label>Correo</label>
      <input type="email" value="eduardo@correo.com">
    </div>
    <div class="field">
      <label>Teléfono</label>
      <input type="tel" value="987654321">
    </div>
    <div class="row">
      <button class="outlined">Limpiar</button>
      <button class="filled">Guardar</button>
    </div>
  </div>

  <div class="overlay">
    <div class="dialog">
      <h2>Datos guardados</h2>
      <p>Nombre: Eduardo<br>Correo: eduardo@correo.com<br>Teléfono: 987654321</p>
      <button>Aceptar</button>
    </div>
  </div>
</body>
</html>
